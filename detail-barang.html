<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Barang — L&F FILKOM</title>

    <!-- ── TAILWIND CSS (via CDN) ── -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- ── FONT: Poppins ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- ── CUSTOM CSS ── -->
    <style>
        body { font-family: 'Poppins', sans-serif; }

        /* Animasi komentar baru muncul dari bawah */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .comment-new { animation: fadeInUp 0.35s ease forwards; }

        /* Toast notifikasi */
        #toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1a1a1a;
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 14px;
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>

<body class="bg-gray-50 min-h-screen">


    <!-- NAVBAR — sama dengan index.html agar konsisten-->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md shadow-sm">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-xl font-bold text-[#F09B37]">L&F FILKOM</div>
            <a href="index.html" class="text-sm text-gray-500 hover:text-[#F09B37] transition flex items-center gap-1 font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                Kembali ke Beranda
            </a>
        </div>
    </nav>
    <!-- /NAVBAR -->


    <!-- Wrapper utama semua konten -->
    <div class="max-w-5xl mx-auto px-6 py-10 flex flex-col gap-10">


        <!-- ============================================================
             KARTU DETAIL BARANG — foto kiri, info kanan
        ============================================================ -->
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col md:flex-row">

            <!-- Foto barang — diisi oleh JS dari data item -->
            <div class="md:w-1/2 w-full bg-gray-100 min-h-[300px]">
                <img
                    id="detail-foto"
                    src=""
                    alt="Foto Barang"
                    class="w-full h-full object-cover"
                >
            </div>

            <!-- Info barang — semua diisi oleh JS -->
            <div class="md:w-1/2 w-full p-8 md:p-10 flex flex-col justify-between gap-6">

                <!-- Bagian atas: badge, nama, detail -->
                <div class="space-y-5">
                    <h1 id="detail-nama" class="text-2xl font-bold text-gray-800"></h1>


                    <!-- Deskripsi, lokasi, tanggal -->
                    <div class="space-y-4 text-sm">

                        <!-- Deskripsi -->
                        <div>
                            <p class="text-gray-400 mb-1 font-semibold">Deskripsi Barang</p>
                            <!-- Diisi JS — jika kosong tampil teks default -->
                            <p id="detail-deskripsi" class="text-gray-700 leading-relaxed">—</p>
                        </div>

                        <!-- Lokasi -->
                        <div class="flex items-start gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[#F09B37] mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                            <div>
                                <p class="text-gray-400 font-semibold">Lokasi Penemuan</p>
                                <!-- Diisi JS -->
                                <p id="detail-lokasi" class="text-gray-700 font-medium">—</p>
                            </div>
                        </div>

                        <!-- Tanggal -->
                        <div class="flex items-start gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[#F09B37] mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                            <div>
                                <p class="text-gray-400 font-semibold">Tanggal Posting</p>
                                <!-- Diisi JS -->
                                <p id="detail-tanggal" class="text-gray-700 font-medium">—</p>
                            </div>
                        </div>

                    </div>
                </div>
                <!-- /Bagian atas -->

                <!-- Tombol WA — href-nya diisi JS berdasarkan nomor WA penemu -->
                <a
                    id="btn-wa"
                    href="#"
                    target="_blank"
                    class="flex items-center justify-center gap-2 bg-[#F09B37] text-white px-6 py-4 rounded-full hover:bg-[#e08c2a] hover:shadow-lg hover:shadow-[#F09B37]/30 transition-all font-bold text-sm"
                >
                    <!-- Ikon WhatsApp -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                    </svg>
                    Hubungi Penemu via WhatsApp
                </a>
                
                <button
                    onclick="markAsFound()"
                    id="btn-found"
                    class="mt-4 bg-green-600 hover:bg-green-700 text-white px-5 py-3 rounded-full font-semibold transition">✓ fitur klaim kode</button>

            </div>
            <!-- /Info barang -->

        </div>
        <!-- /KARTU DETAIL BARANG -->


        <!-- SECTION KOMENTAR -->
        <div>
            <h2 class="text-2xl font-bold mb-5 text-gray-800">Komentar</h2>

            <!-- Kotak komentar -->
            <div class="bg-gray-100 rounded-3xl p-6 md:p-8 flex flex-col gap-0">

                <!-- ── Daftar komentar — diisi oleh JS (renderComments()) ── -->
                <div id="comments-list" class="flex flex-col">
                    <!-- Komentar dirender di sini oleh detail-script.js -->
                </div>

                <!-- Pesan jika belum ada komentar — disembunyikan JS jika ada komentar -->
                <p id="no-comments" class="text-gray-400 text-sm text-center py-4 hidden">
                    Belum ada komentar. Jadilah yang pertama!
                </p>

                <!-- ── Form input komentar baru ── -->
                <div class="flex items-start gap-4 pt-6 border-t border-gray-200 mt-2">

                    <!-- Ikon avatar (default) -->
                    <div class="flex-shrink-0 mt-1">
                        <div class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-500" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                            </svg>
                        </div>
                    </div>

                    <!-- Input nama + teks komentar -->
                    <div class="flex-1 space-y-3">

                        <!-- Input nama pengirim -->
                        <input
                            id="comment-name"
                            type="text"
                            placeholder="Nama kamu..."
                            class="w-full py-2.5 px-4 bg-white border border-gray-200 rounded-2xl outline-none text-sm focus:ring-2 focus:ring-[#F09B37] transition"
                        />

                        <!-- Textarea isi komentar -->
                        <textarea
                            id="comment-text"
                            rows="3"
                            placeholder="Tuliskan pertanyaan atau informasi..."
                            class="w-full py-3 px-4 bg-white border border-gray-200 rounded-2xl outline-none text-sm resize-none focus:ring-2 focus:ring-[#F09B37] transition"
                        ></textarea>

                        <!-- Tombol kirim — panggil submitComment() di detail-script.js -->
                        <div class="flex justify-end">
                            <button
                                onclick="submitComment()"
                                class="bg-[#F09B37] text-white px-7 py-2.5 rounded-full font-bold text-sm hover:bg-[#e08c2a] hover:shadow-md hover:shadow-[#F09B37]/30 transition-all"
                            >
                                Kirim
                            </button>
                        </div>

                    </div>
                </div>
                <!-- /Form input komentar -->

            </div>
        </div>
        <!-- /SECTION KOMENTAR -->


    </div>
    <!-- /Wrapper utama -->


    <!-- ── TOAST NOTIFIKASI ── -->
    <div id="toast"></div>

    <!-- ── SCRIPT UTAMA — berisi semua logika termasuk halaman detail ── -->
    <script src="script.js"></script>

</body>
</html>
